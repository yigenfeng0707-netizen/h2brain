name: ModelScope Studio Keepalive

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ModelScope Studio
        env:
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        run: |
          echo "=== Keepalive $(date -u) ==="

          # 1. Ping ModelScope Studio page (trigger container start if sleeping)
          PAGE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "User-Agent: $UA" \
            "https://www.modelscope.cn/studios/gsym236998/h2brain")
          echo "ModelScope page: $PAGE_CODE"

          # 2. Wait for container warmup
          sleep 5

          # 3. Ping direct URL (keep container alive)
          DIRECT_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "User-Agent: $UA" \
            "https://gsym236998-h2brain.ms.show")
          echo "Direct URL: $DIRECT_CODE"

          # 4. Ping API endpoint (keep backend alive)
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "User-Agent: $UA" \
            "https://gsym236998-h2brain.ms.show/api/operations")
          echo "API endpoint: $API_CODE"

          # 5. Summary
          if [ "$DIRECT_CODE" = "200" ]; then
            echo "✅ Container is alive"
          else
            echo "⚠️ Direct URL returned $DIRECT_CODE"
          fi
